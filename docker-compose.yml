services:
  # Database - PostgreSQL 17 (Available locally)
  db:
    image: postgres:17
    container_name: clinicaplus-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clinicaplus
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Cache & Jobs - Redis 7
  redis:
    image: redis:7-alpine
    container_name: clinicaplus-redis
    restart: always
    ports:
      - "6380:6379"

  # Evolution API v2
  evolution:
    image: atendai/evolution-api:v2.2.1
    container_name: clinicaplus-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/clinicaplus?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
      - redis

  # Backend - API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clinicaplus-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/clinicaplus?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - db
      - redis

  # Frontend - Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clinicaplus-web
    restart: always
    ports:
      - "5173:80" # Mapping local dev port to nginx 80
    depends_on:
      - api

volumes:
  pgdata:
  evolution_instances:
